name: Dependency Review

# Fails pull requests that introduce dependencies with known vulnerabilities
# (GitHub Advisory Database). Complements the pnpm audit gate in ci.yml:
# dependency-review blocks NEW vulnerable introductions at any severity on the
# PR diff, while pnpm audit scans the full resolved tree at moderate+.
# Note: this gate only evaluates future pull requests; it does not scan
# dependencies already on main.
#
# It does not read the audit's ignore list, `pnpm.auditConfig.ignoreGhsas` in
# package.json (FaultMaven/faultmaven#2913). It fails a PR that adds or
# changes any package with a known advisory, dev or production alike: the
# dependency graph tags every pnpm dependency `runtime`, the action's default
# fail scope. That includes a package whose advisory the audit ignores. It is
# not a required check, so a maintainer may merge past it, but only after
# recording the advisory's reach on the PR. Do not add `allow-ghsas`, by hand
# or copied from package.json: this file is read from the PR itself, so the
# PR would grant its own exception.

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  # Required by comment-summary-in-pr (the action posts its summary as a PR
  # comment on failure).
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          # Fail on any known-vulnerable introduction, regardless of severity.
          # This is diff-scoped (only deps the PR adds/changes), so a strict
          # threshold stays low-noise.
          fail-on-severity: low
          comment-summary-in-pr: on-failure
