name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  SERVICE_NAME: faultmaven-website
  NODE_VERSION: '20'
  PNPM_VERSION: '10'

jobs:
  # ============================================================================
  # Stage 1: Lint & Type Check
  # ============================================================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Reads the repo (checkout) and runs local tooling. Step summaries are
    # written to a file, not through the API, so no write scope is needed.
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Lint summary
        if: success()
        run: |
          echo "### ✅ Lint & Type Check Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "ESLint and TypeScript compilation successful." >> $GITHUB_STEP_SUMMARY

      - name: Lint failure
        if: failure()
        run: |
          echo "### ❌ Lint & Type Check Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Lint or type checking failed. Fix errors before proceeding." >> $GITHUB_STEP_SUMMARY
          exit 1

  # ============================================================================
  # Stage 2: Build Verification
  # ============================================================================
  build:
    name: Build Verification
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Checkout plus a local Next.js build. Deployment is Vercel's, not this
    # job's, so it needs no write scope.
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js application
        run: pnpm run build
        env:
          # Add any required build-time environment variables
          NODE_ENV: production

      - name: Build summary
        if: success()
        run: |
          echo "### ✅ Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Next.js application built successfully." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note**: Deployment is handled by Vercel automatically." >> $GITHUB_STEP_SUMMARY
          echo "- Production: Automatically deploys from \`main\` branch" >> $GITHUB_STEP_SUMMARY
          echo "- Preview: Automatically deploys from pull requests" >> $GITHUB_STEP_SUMMARY

      - name: Build failure
        if: failure()
        run: |
          echo "### ❌ Build Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Next.js build failed. Fix build errors before proceeding." >> $GITHUB_STEP_SUMMARY
          exit 1

  # ============================================================================
  # Stage 3: Security Scan
  # ============================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Checkout plus `pnpm audit`, which queries the npm registry rather than
    # the GitHub API. No SARIF upload here, so no security-events: write.
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm audit` exits 1 both when it finds advisories AND when it cannot
      # reach npm's advisory endpoint, so the two were indistinguishable: an
      # npm-side outage looked exactly like a vulnerability and blocked every
      # PR. This separates them.
      #
      # Advisories still fail the build. Only a transport failure is tolerated,
      # and only loudly — it emits a warning annotation and says in the job
      # summary that the gate did not run. That is deliberate rather than
      # `--ignore-registry-errors`, which would exit 0 on a registry error with
      # no trace, turning the gate into a silent no-op.
      #
      # What still covers us while it is degraded: Dependency Review blocks any
      # PR that introduces a known-vulnerable dependency (fail-on-severity:
      # low), and Dependabot alerts watch the standing tree server-side. Both
      # use the GitHub API, not npm's advisory endpoint.
      - name: Run pnpm audit
        env:
          # Fail each attempt fast; the retry loop below owns the backoff.
          npm_config_fetch_retries: '0'
        run: |
          attempts=4
          out=''
          for i in $(seq 1 "$attempts"); do
            out="$(pnpm audit --audit-level=moderate 2>&1)" && {
              echo "$out"
              echo "pnpm audit completed with no advisories at or above moderate."
              echo "### Security Scan: clean" >> "$GITHUB_STEP_SUMMARY"
              echo "\`pnpm audit --audit-level=moderate\` found no advisories." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            }

            if printf '%s' "$out" | grep -qiE 'ERR_SOCKET_TIMEOUT|FetchError|socket timeout|ECONNRESET|ETIMEDOUT|EAI_AGAIN|ENOTFOUND|request to .* failed'; then
              echo "::notice::attempt $i/$attempts: npm advisory endpoint unreachable, retrying"
              sleep $(( i * 20 ))
              continue
            fi

            # Audit ran and reported something. That is a finding: fail closed.
            echo "$out"
            echo "::error::pnpm audit reported advisories at or above moderate."
            {
              echo "### Security Scan: advisories found"
              echo ""
              echo "\`pnpm audit --audit-level=moderate\` reported advisories. See the step log."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          done

          echo "$out"
          echo "::warning::npm advisory endpoint unreachable after $attempts attempts — this scan did not run. Dependency Review and Dependabot alerts still apply."
          {
            echo "### Security Scan: DID NOT RUN"
            echo ""
            echo "npm's advisory endpoint (\`registry.npmjs.org/-/npm/v1/security/audits/quick\`)"
            echo "was unreachable after $attempts attempts, so **no audit was performed**."
            echo "This is not a clean result."
            echo ""
            echo "Still in force: Dependency Review (fails on any known-vulnerable"
            echo "introduction, severity low and up) and Dependabot alerts on the"
            echo "default branch. Re-run this job once npm recovers."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Security summary
        if: always()
        run: |
          echo "### 🔒 Security Scan Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Security scan completed. Review findings above." >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # Pipeline Summary
  # ============================================================================
  summary:
    name: Pipeline Summary
    needs: [lint, build, security]
    if: always()
    runs-on: ubuntu-latest
    # No checkout and no API calls: this job only echoes into the step
    # summary file, so it needs no token scope at all.
    permissions: {}

    steps:
      - name: Pipeline summary
        run: |
          echo "### 📊 CI Pipeline Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint & Type Check | ${{ needs.lint.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Verification | ${{ needs.build.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security.result == 'success' && '✅ Passed' || needs.security.result == 'failure' && '❌ Failed' || '⏭️  Skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment**: Handled by Vercel automatically" >> $GITHUB_STEP_SUMMARY
          echo "- Production: Auto-deploy from \`main\` branch" >> $GITHUB_STEP_SUMMARY
          echo "- Preview: Auto-deploy from pull requests" >> $GITHUB_STEP_SUMMARY
