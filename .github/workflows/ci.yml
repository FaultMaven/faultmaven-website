name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  SERVICE_NAME: faultmaven-website
  NODE_VERSION: '20'
  PNPM_VERSION: '10'

jobs:
  # ============================================================================
  # Stage 1: Lint & Type Check
  # ============================================================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Reads the repo (checkout) and runs local tooling. Step summaries are
    # written to a file, not through the API, so no write scope is needed.
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Unit tests
        run: pnpm test

      - name: Lint summary
        if: success()
        run: |
          echo "### ✅ Lint, Type Check & Unit Tests Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "ESLint, TypeScript compilation and jest successful." >> $GITHUB_STEP_SUMMARY

      - name: Lint failure
        if: failure()
        run: |
          echo "### ❌ Lint & Type Check Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Lint, type checking or unit tests failed. Fix errors before proceeding." >> $GITHUB_STEP_SUMMARY
          exit 1

  # ============================================================================
  # Stage 2: Build Verification
  # ============================================================================
  build:
    name: Build Verification
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Checkout plus a local Next.js build. Deployment is Vercel's, not this
    # job's, so it needs no write scope.
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js application
        run: pnpm run build
        env:
          # Add any required build-time environment variables
          NODE_ENV: production

      # Starts the build it just made and checks what the server sends:
      # security headers, 404 statuses, the post redirect, titles.
      - name: Built-site checks
        run: pnpm run test:build

      # Loads every prerendered page in headless Chromium under the
      # production Content-Security-Policy: no policy violation, no console
      # error, React hydrated, the menu responds, diagrams render.
      - name: Install Chromium for the browser checks
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser checks
        run: pnpm run test:browser

      - name: Build summary
        if: success()
        run: |
          echo "### ✅ Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Next.js application built successfully." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note**: Deployment is handled by Vercel automatically." >> $GITHUB_STEP_SUMMARY
          echo "- Production: Automatically deploys from \`main\` branch" >> $GITHUB_STEP_SUMMARY
          echo "- Preview: Automatically deploys from pull requests" >> $GITHUB_STEP_SUMMARY

      - name: Build failure
        if: failure()
        run: |
          echo "### ❌ Build Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Next.js build failed. Fix build errors before proceeding." >> $GITHUB_STEP_SUMMARY
          exit 1

  # ============================================================================
  # Stage 3: Security Scan
  # ============================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Checkout plus `pnpm audit`, which queries the npm registry rather than
    # the GitHub API. No SARIF upload here, so no security-events: write.
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm audit` exits 1 both when it finds advisories AND when it cannot
      # reach npm's advisory endpoint, so the two were indistinguishable: an
      # npm-side outage looked exactly like a vulnerability and blocked every
      # PR. This separates them. The retry and the transport-error grammar live
      # in .github/actions/lockfile-audit, which the daily scheduled-audit.yml
      # also runs against main (faultmaven#2159), so both use one level.
      #
      # Advisories still fail the build. Only an outage is tolerated here
      # (`on-unreachable: warn`): the endpoint unreachable, answering only 5xx,
      # 408 or 429, or stalled, for all four attempts. Even that only loudly: it
      # emits a warning annotation and says in the job summary that the gate did
      # not run. That is deliberate rather than `--ignore-registry-errors`, which
      # would exit 0 on a registry error with no trace, turning the gate into a
      # silent no-op.
      # The scheduled run uses `fail`, so a day it could not audit reads red.
      #
      # What still covers us while it is degraded: Dependency Review blocks any
      # PR that introduces a known-vulnerable dependency (fail-on-severity:
      # low), and Dependabot alerts watch the standing tree server-side. Both
      # use the GitHub API, not npm's advisory endpoint.
      #
      # `pnpm.auditConfig.ignoreGhsas` in package.json skips named advisories.
      # It holds only advisories with no patched release whose package reaches
      # build, lint and test tooling alone (`pnpm why <pkg> --prod` is empty),
      # never what the site ships. Drop an entry once a fix is published:
      #   GHSA-vfj7-8cjw-p6xm  braces <=3.0.3, via micromatch (fast-glob, jest)
      - name: Run pnpm audit
        id: audit
        uses: ./.github/actions/lockfile-audit
        with:
          on-unreachable: warn

      - name: Say what still covers an audit that did not run
        if: steps.audit.outputs.result == 'unreachable'
        run: |
          echo "::warning::Dependency Review and Dependabot alerts still apply."
          {
            echo ""
            echo "Still in force: Dependency Review (fails on any known-vulnerable"
            echo "introduction, severity low and up) and Dependabot alerts on the"
            echo "default branch. Re-run this job once npm recovers."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Security summary
        if: always()
        run: |
          echo "### 🔒 Security Scan Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Security scan completed. Review findings above." >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # Pipeline Summary
  # ============================================================================
  summary:
    name: Pipeline Summary
    needs: [lint, build, security]
    if: always()
    runs-on: ubuntu-24.04
    # 60 green runs to 2026-10-23 top out at 5s; the floor is 5m.
    timeout-minutes: 5
    # No checkout and no API calls: this job only echoes into the step
    # summary file, so it needs no token scope at all.
    permissions: {}

    steps:
      - name: Pipeline summary
        run: |
          echo "### 📊 CI Pipeline Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint & Type Check | ${{ needs.lint.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Verification | ${{ needs.build.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security.result == 'success' && '✅ Passed' || needs.security.result == 'failure' && '❌ Failed' || '⏭️  Skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment**: Handled by Vercel automatically" >> $GITHUB_STEP_SUMMARY
          echo "- Production: Auto-deploy from \`main\` branch" >> $GITHUB_STEP_SUMMARY
          echo "- Preview: Auto-deploy from pull requests" >> $GITHUB_STEP_SUMMARY
