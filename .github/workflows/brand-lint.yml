name: Brand Lint

# Enforces FaultMaven's canonical product terminology in brand-facing files.
# Source of truth: faultmaven repo, .claude/skills/brand-messaging/SKILL.md (§3/§7).
# Pure Node stdlib — nothing to install.

on:
  pull_request:
    paths:
      - "README.md"
      - "src/**"
      - "scripts/brand-lint.mjs"
      - ".github/workflows/brand-lint.yml"
  push:
    branches: [main]

# Checkout plus a stdlib Node script; nothing is written back to the repo.
permissions:
  contents: read

jobs:
  brand-lint:
    runs-on: ubuntu-24.04
    # 60 green runs to 2026-10-23 top out at 13s; the floor is 5m.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: FaultMaven/ci-actions/setup-js@4b5989bc5f9e1fcd5eee69cf18cfa0854a6f2894 # v1.2.0
        with:
          pnpm: 'false'
          install: 'false'
      - name: Run brand-messaging lint
        run: node scripts/brand-lint.mjs
